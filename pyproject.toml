[tool.poetry]
name = "shieldscan-api"
version = "0.1.0"
description = "ShieldScan API and AI analysis platform"
authors = ["Odyssey Technology <team@shieldscan.io>"]
readme = "README.md"
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.135.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
asyncpg = "^0.30.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
redis = "^5.2.0"
qdrant-client = "^1.12.0"
anthropic = "^0.40.0"
openai = "^1.54.0"
stripe = "^11.0.0"
boto3 = "^1.35.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^5.0"
python-slugify = "^8.0"
cryptography = "^43.0.0"
weasyprint = "^62.3"
jinja2 = "^3.1.4"
httpx = "^0.28.0"
email-validator = "^2.2.0"
sse-starlette = "^2.1.0"
prometheus-fastapi-instrumentator = "^7.0.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.17.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
fakeredis = "^2.35"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
