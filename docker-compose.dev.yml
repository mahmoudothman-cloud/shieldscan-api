services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: shieldscan
      POSTGRES_PASSWORD: shieldscan
      POSTGRES_DB: shieldscan
    ports:
      - "5432:5432"
    volumes:
      # Mount the PARENT dir, not /var/lib/postgresql/data.
      # PG18's official image stores data under /var/lib/postgresql/18/docker/ so
      # pg_upgrade --link can run across majors without crossing a mount boundary.
      # Mounting at /var/lib/postgresql/data triggers a startup refusal on PG18+.
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8.6.2
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
