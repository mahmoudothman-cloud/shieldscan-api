services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: shieldscan
      POSTGRES_PASSWORD: shieldscan
      POSTGRES_DB: shieldscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.6.2
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
